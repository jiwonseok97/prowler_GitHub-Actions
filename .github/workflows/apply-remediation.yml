name: Apply Remediation

on:
  pull_request:
    types: [opened, synchronize, closed]
    # No paths filter — remediation PR merges where .tf files are already on main
    # (from a prior merge) would produce empty diffs and never trigger the apply job.
    # Branch name filtering is done in the job conditions instead.

env:
  TF_BACKEND_BUCKET: prowler-terraform-state-132410971304
  TF_BACKEND_TABLE: prowler-terraform-locks
  TF_BACKEND_REGION: ap-northeast-2

permissions:
  contents: read
  id-token: write
  actions: write
  pull-requests: write

jobs:
  # -------------------------------------------------------
  # Plan: run on PR updates and post Terraform plan comment
  # -------------------------------------------------------
  plan:
    if: >-
      github.event.pull_request.merged != true
      && github.event.action != 'closed'
      && startsWith(github.event.pull_request.head.ref, 'remediation/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Install IaC quality tools (tflint + tfsec + checkov)
        run: |
          curl -sSL -o /usr/local/bin/tfsec https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64
          chmod +x /usr/local/bin/tfsec
          curl -sSL -o /tmp/tflint.zip https://github.com/terraform-linters/tflint/releases/latest/download/tflint_linux_amd64.zip
          unzip -q /tmp/tflint.zip -d /tmp
          mv /tmp/tflint /usr/local/bin/tflint
          tflint --init
          pip install -q checkov

      - name: Pre-flight AWS discovery
        run: bash iac/scripts/preflight_discovery.sh /tmp/aws_discovery.json

      - name: Collect changed files and group by category
        id: changed
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if ! git cat-file -e "$HEAD" 2>/dev/null; then
            echo "WARN: head SHA $HEAD not found; using merge commit diff"
            HEAD="HEAD"
            BASE="HEAD~1"
          fi

          # Detect categories from all changed remediation files (.tf + .json)
          files=$(git diff --name-status "$BASE" "$HEAD" -- 'remediation/**' | awk '$1!="D"{print $NF}' | tr '\n' ' ')
          echo "files=$files" >> $GITHUB_OUTPUT

          categories=""
          for file in $files; do
            dir=$(echo "$file" | cut -d'/' -f2)
            if [ "$dir" = "manifests" ]; then
              cat=$(basename "$file" .json)
            else
              cat="$dir"
            fi
            if [ -n "$cat" ] && ! echo "$categories" | grep -qw "$cat"; then
              categories="$categories $cat"
            fi
          done

          # Fallback: extract category from PR branch name
          branch="${{ github.event.pull_request.head.ref }}"
          if [ -z "$(echo $categories | xargs)" ] && echo "$branch" | grep -q '^remediation/'; then
            cat=$(echo "$branch" | sed 's|^remediation/||' | sed 's/-[0-9].*$//')
            if [ -n "$cat" ]; then
              echo "INFO: No files detected via diff; using branch name category: $cat"
              categories="$cat"
            fi
          fi

          echo "categories=$(echo $categories | xargs)" >> $GITHUB_OUTPUT
          echo "Detected categories: $(echo $categories | xargs)"

      - name: Terraform Plan (per category)
        id: plan
        continue-on-error: true
        run: |
          set -euo pipefail
          : > /tmp/tfplan.txt
          : > /tmp/tfgate.txt
          exitcode=0

          if [ -z "${{ steps.changed.outputs.categories }}" ]; then
            echo "No remediation categories changed." >> /tmp/tfplan.txt
          else
            for category in ${{ steps.changed.outputs.categories }}; do
              echo "## Category: $category" >> /tmp/tfplan.txt
              echo "## Category: $category" >> /tmp/tfgate.txt
              work=$(mktemp -d)
              state_key="remediation/${category}.tfstate"

              # Copy only files listed in category-specific manifest for this category.
              # Fallback to remediation/manifest.json for backward compatibility.
              file_count=0
              cat_files=$(CATEGORY="$category" python3 - <<'PY'
          import json
          import os

          category = os.environ.get("CATEGORY", "").strip()
          selected = []
          if category:
              cat_manifest = f"remediation/manifests/{category}.json"
              root_manifest = "remediation/manifest.json"
              items = []
              if os.path.exists(cat_manifest):
                  with open(cat_manifest, "r", encoding="utf-8") as f:
                      items = json.load(f)
              elif os.path.exists(root_manifest):
                  with open(root_manifest, "r", encoding="utf-8") as f:
                      items = json.load(f)
              seen = set()
              for item in items:
                  if str(item.get("category", "")).strip() != category:
                      continue
                  if str(item.get("validation_status", "ok")).strip().lower() == "excluded":
                      continue
                  fname = str(item.get("file") or item.get("output_path") or "").strip()
                  if not fname or fname in seen:
                      continue
                  seen.add(fname)
                  selected.append(f"remediation/{fname}")
          print("\n".join(selected))
          PY
              )
              for f in $cat_files; do
                [ -f "$f" ] || continue
                cp "$f" "$work/"
                file_count=$((file_count+1))
              done

              if [ "$file_count" -eq 0 ]; then
                echo "SKIP $category: no files found" | tee -a /tmp/tfplan.txt /tmp/tfgate.txt
                exitcode=1
                continue
              fi

              echo "  Files: $file_count" >> /tmp/tfplan.txt

              # Run cleanup on each file
              for tf in "$work"/*.tf; do
                python3 iac/scripts/cleanup_hcl.py "$tf"
              done

              # Deduplicate resource/data blocks across files
              python3 iac/scripts/dedup_resources.py "$work"

              # Copy optional tfvars for this category (if provided)
              if [ -f "remediation/${category}.auto.tfvars" ]; then
                cp "remediation/${category}.auto.tfvars" "$work/"
              fi
              if [ -f "remediation/terraform.auto.tfvars" ]; then
                cp "remediation/terraform.auto.tfvars" "$work/"
              fi

              # Generate discovery-driven tfvars so variables get real values
              # instead of default="" which causes count=0 (no resources created)
              manifest_path="remediation/manifests/${category}.json"
              if [ ! -f "$manifest_path" ]; then
                manifest_path="remediation/manifest.json"
              fi
              python3 iac/scripts/generate_tfvars.py /tmp/aws_discovery.json "$work" "$category" "$manifest_path" 2>&1 || true

              # Check if any resource blocks remain
              if ! grep -rEq '^\s*resource\s+"' "$work"/*.tf 2>/dev/null; then
                echo "SKIP $category: no resource blocks after cleanup" | tee -a /tmp/tfplan.txt /tmp/tfgate.txt
                exitcode=1
                continue
              fi

              cat > "$work/backend.tf" <<EOF
          terraform {
            backend "s3" {
              bucket         = "${TF_BACKEND_BUCKET}"
              key            = "${state_key}"
              region         = "${TF_BACKEND_REGION}"
              dynamodb_table = "${TF_BACKEND_TABLE}"
              encrypt        = true
            }
          }
          EOF

              cat > "$work/provider.tf" <<'EOF'
          provider "aws" {
            region = "ap-northeast-2"
          }
          EOF

              cat > "$work/data.tf" <<'EOF'
          data "aws_caller_identity" "current" {}
          data "aws_region" "current" {}
          data "aws_partition" "current" {}
          EOF

              cat > "$work/.tflint.hcl" <<'EOF'
          rule "terraform_unused_declarations" {
            enabled = false
          }
          rule "terraform_required_providers" {
            enabled = false
          }
          rule "terraform_required_version" {
            enabled = false
          }
          rule "terraform_deprecated_interpolation" {
            enabled = false
          }
          EOF

              terraform -chdir="$work" init -input=false 2>&1 | tee -a /tmp/tfplan.txt

              # Auto-import existing resources before plan
              bash iac/scripts/auto_import.sh "$work" /tmp/aws_discovery.json 2>&1 | tee -a /tmp/tfplan.txt || true

              if ! (cd "$work" && tflint -f compact --minimum-failure-severity=error 2>&1 | tee -a /tmp/tfgate.txt); then
                echo "SKIP $category: tflint failed" | tee -a /tmp/tfplan.txt /tmp/tfgate.txt
                exitcode=1
                continue
              fi
              # tfsec: record warnings only (non-blocking for remediation code)
              tfsec --no-colour "$work" 2>&1 | tee -a /tmp/tfgate.txt || echo "WARN $category: tfsec found issues (non-blocking)" | tee -a /tmp/tfplan.txt

              # Checkov: built-in + custom checks (non-blocking, results logged)
              echo "### Checkov ($category)" >> /tmp/checkov-results.txt
              checkov -d "$work" \
                --external-checks-dir iac/policies/checkov \
                --config-file iac/policies/.checkov.yaml \
                --output cli \
                --soft-fail \
                2>&1 | tee -a /tmp/tfgate.txt >> /tmp/checkov-results.txt || echo "WARN $category: checkov scan failed (non-blocking)" | tee -a /tmp/tfplan.txt

              if ! terraform -chdir="$work" validate 2>&1 | tee -a /tmp/tfplan.txt /tmp/tfgate.txt; then
                echo "SKIP $category: validate failed" | tee -a /tmp/tfplan.txt /tmp/tfgate.txt
                exitcode=1
                continue
              fi
              terraform -chdir="$work" plan -no-color -out=tfplan.binary | tee -a /tmp/tfplan.txt

              # Checkov plan-json scan (deeper analysis on planned changes)
              terraform -chdir="$work" show -json tfplan.binary > "$work/plan.json"
              checkov -f "$work/plan.json" \
                --framework terraform_plan \
                --config-file iac/policies/.checkov.yaml \
                --output cli \
                --soft-fail \
                2>&1 | tee -a /tmp/tfgate.txt >> /tmp/checkov-results.txt || true
              infracost breakdown --path "$work/plan.json" \
                --format json \
                --out-file "/tmp/infracost-${category}.json" 2>&1 | tee -a /tmp/tfplan.txt
                            if [ ${PIPESTATUS[0]} -ne 0 ]; then exitcode=1; fi
                          done
                        fi

          # Merge all infracost outputs
          cost_files=""
          for f in /tmp/infracost-*.json; do
            [ -f "$f" ] && cost_files="$cost_files --path $f"
          done
          if [ -n "$cost_files" ]; then
            infracost output --format json $cost_files --out-file /tmp/infracost-total.json
            infracost output --format table $cost_files --out-file /tmp/infracost-table.txt
          fi

          # Build categorized cost summaries for richer PR comments.
          python3 - <<'PY'
          import glob
          import json
          import os
          import re
          from collections import defaultdict

          def to_float(v):
              try:
                  if v is None or v == "":
                      return 0.0
                  if isinstance(v, str):
                      v = v.replace(",", "").replace("$", "").strip()
                  return float(v)
              except Exception:
                  return 0.0

          def resource_monthly(resource):
              if not isinstance(resource, dict):
                  return 0.0
              direct = to_float(resource.get("monthlyCost"))
              if direct != 0.0:
                  return direct
              comps = resource.get("costComponents")
              if isinstance(comps, list):
                  return sum(to_float(c.get("monthlyCost")) for c in comps if isinstance(c, dict))
              return 0.0

          def extract_total(data):
              if not isinstance(data, dict):
                  return 0.0
              if "totalMonthlyCost" in data:
                  return to_float(data.get("totalMonthlyCost"))
              projects = data.get("projects")
              if isinstance(projects, list):
                  total = 0.0
                  for p in projects:
                      if not isinstance(p, dict):
                          continue
                      total += to_float((p.get("breakdown") or {}).get("totalMonthlyCost"))
                  if total > 0:
                      return total
                  for p in projects:
                      if not isinstance(p, dict):
                          continue
                      resources = (p.get("breakdown") or {}).get("resources") or []
                      if isinstance(resources, list):
                          total += sum(resource_monthly(r) for r in resources)
                  return total
              return 0.0

          def service_name(resource):
              if not isinstance(resource, dict):
                  return "unknown"
              rtype = str(resource.get("resourceType") or "")
              if rtype:
                  m = re.match(r"aws_([^_]+)", rtype)
                  return m.group(1) if m else rtype
              name = str(resource.get("name") or "")
              m = re.match(r"aws_([^_]+)", name)
              return m.group(1) if m else "unknown"

          def resource_label(resource):
              if not isinstance(resource, dict):
                  return "unknown"
              return str(resource.get("name") or resource.get("resourceType") or "unknown")

          def write_md(path, headers, rows):
              with open(path, "w", encoding="utf-8") as f:
                  f.write("| " + " | ".join(headers) + " |\n")
                  f.write("| " + " | ".join(["---"] * len(headers)) + " |\n")
                  for row in rows:
                      f.write("| " + " | ".join(row) + " |\n")

          category_totals = {}
          service_totals = defaultdict(float)
          resource_totals = defaultdict(float)

          for path in sorted(glob.glob("/tmp/infracost-*.json")):
              base = os.path.basename(path)
              if base == "infracost-total.json":
                  continue
              m = re.match(r"infracost-(.+)\.json$", base)
              if not m:
                  continue
              category = m.group(1)
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      data = json.load(f)
              except Exception:
                  continue

              category_totals[category] = category_totals.get(category, 0.0) + extract_total(data)
              projects = data.get("projects") if isinstance(data, dict) else []
              if not isinstance(projects, list):
                  continue
              for p in projects:
                  if not isinstance(p, dict):
                      continue
                  resources = (p.get("breakdown") or {}).get("resources") or []
                  if not isinstance(resources, list):
                      continue
                  for r in resources:
                      monthly = resource_monthly(r)
                      if monthly <= 0:
                          continue
                      svc = service_name(r)
                      label = resource_label(r)
                      service_totals[svc] += monthly
                      resource_totals[f"{svc}:{label}"] += monthly

          category_rows = sorted(category_totals.items(), key=lambda x: x[1], reverse=True)
          service_rows = sorted(service_totals.items(), key=lambda x: x[1], reverse=True)
          resource_rows = sorted(resource_totals.items(), key=lambda x: x[1], reverse=True)[:15]

          write_md(
              "/tmp/infracost-category-summary.md",
              ["Category", "Monthly Cost (USD)"],
              [[k, f"${v:.2f}"] for k, v in category_rows] or [["(none)", "$0.00"]],
          )
          write_md(
              "/tmp/infracost-service-summary.md",
              ["Service", "Monthly Cost (USD)"],
              [[k, f"${v:.2f}"] for k, v in service_rows] or [["(none)", "$0.00"]],
          )
          write_md(
              "/tmp/infracost-top-resources.md",
              ["Resource", "Monthly Cost (USD)"],
              [[k.split(":", 1)[1], f"${v:.2f}"] for k, v in resource_rows] or [["(none)", "$0.00"]],
          )
          PY
          echo "exitcode=$exitcode" >> "$GITHUB_OUTPUT"

      - name: Post Plan to PR comment
        uses: actions/github-script@v8
        env:
          PLAN_OUTPUT: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('/tmp/tfplan.txt', 'utf8');
            if (plan.length > 50000) {
              plan = plan.substring(0, 50000) + '\n\n... (truncated)';
            }

            // Read Infracost outputs
            const readIfExists = (path) => fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '';
            const toNumber = (value) => {
              if (value === null || value === undefined) return 0;
              const n = parseFloat(String(value).replace(/[$,]/g, '').trim());
              return Number.isFinite(n) ? n : 0;
            };
            const extractMonthlyCost = (costJson) => {
              if (!costJson || typeof costJson !== 'object') return 0;
              if (costJson.totalMonthlyCost !== undefined) return toNumber(costJson.totalMonthlyCost);
              if (Array.isArray(costJson.projects)) {
                return costJson.projects.reduce((sum, p) => sum + toNumber(p?.breakdown?.totalMonthlyCost), 0);
              }
              return 0;
            };

            let costSection = '';
            try {
              const costTable = readIfExists('/tmp/infracost-table.txt');
              const categorySummary = readIfExists('/tmp/infracost-category-summary.md');
              const serviceSummary = readIfExists('/tmp/infracost-service-summary.md');
              const topResources = readIfExists('/tmp/infracost-top-resources.md');
              const totalCostJson = readIfExists('/tmp/infracost-total.json');
              const costJson = totalCostJson ? JSON.parse(totalCostJson) : {};
              const monthly = extractMonthlyCost(costJson);
              const emoji = monthly > 100 ? 'HIGH' : monthly > 0 ? 'INFO' : 'OK';

              costSection = `\n### ${emoji} Estimated Monthly Cost: $${monthly.toFixed(2)}\n`;
              if (categorySummary) {
                costSection += `\n#### By Category\n${categorySummary}\n`;
              }
              if (serviceSummary) {
                costSection += `\n#### By Service\n${serviceSummary}\n`;
              }
              if (topResources) {
                costSection += `\n#### Top Resources (Monthly)\n${topResources}\n`;
              }
              if (costTable) {
                costSection += `\n<details>\n<summary>Infracost Raw Table (click to expand)</summary>\n\n\`\`\`\n${costTable}\n\`\`\`\n\n</details>\n`;
              }
            } catch (e) {
              costSection = '\n### Cost details unavailable (Infracost failed)\n';
            }

            // Read Checkov results
            let checkovSection = '';
            try {
              const checkovResults = readIfExists('/tmp/checkov-results.txt');
              if (checkovResults) {
                const passed = (checkovResults.match(/Passed checks: (\d+)/g) || [])
                  .reduce((sum, m) => sum + parseInt(m.match(/\d+/)[0]), 0);
                const failed = (checkovResults.match(/Failed checks: (\d+)/g) || [])
                  .reduce((sum, m) => sum + parseInt(m.match(/\d+/)[0]), 0);
                const statusEmoji = failed > 0 ? 'WARN' : 'OK';
                checkovSection = `\n### ${statusEmoji} Checkov: ${passed} passed, ${failed} failed\n`;
                if (failed > 0) {
                  // Extract failed check lines
                  const failedLines = checkovResults.split('\n')
                    .filter(l => l.includes('FAILED') || l.match(/Check: CKV/))
                    .slice(0, 20)
                    .join('\n');
                  checkovSection += `\n<details>\n<summary>Checkov findings (click to expand)</summary>\n\n\`\`\`\n${failedLines}\n\`\`\`\n\n</details>\n`;
                }
              }
            } catch (e) {
              checkovSection = '';
            }

            const exitcode = process.env.PLAN_OUTPUT;
            const status = exitcode === '0' ? 'Plan Succeeded' : 'Plan Failed';

            const body = `### Terraform Plan Result - ${status}
            ${costSection}
            ${checkovSection}
            <details>
            <summary>Plan details (click to expand)</summary>

            \`\`\`
            ${plan}
            \`\`\`

            </details>

            > Merging this PR will auto-apply these resources to AWS.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Terraform Plan Result')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Fail if plan failed
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1

      - name: Upload quality gate logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: remediation-quality-gates
          path: |
            /tmp/tfgate.txt
            /tmp/checkov-results.txt

      - name: Upload cost estimate
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: remediation-cost-estimate
          path: |
            /tmp/infracost-*.json
            /tmp/infracost-*.md
            /tmp/infracost-table.txt

  # -------------------------------------------------------
  # Apply: run after PR merge and apply to AWS
  # -------------------------------------------------------
  apply:
    if: >-
      github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'remediation/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Install IaC quality tools (tflint + tfsec + checkov)
        run: |
          curl -sSL -o /usr/local/bin/tfsec https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64
          chmod +x /usr/local/bin/tfsec
          curl -sSL -o /tmp/tflint.zip https://github.com/terraform-linters/tflint/releases/latest/download/tflint_linux_amd64.zip
          unzip -q /tmp/tflint.zip -d /tmp
          mv /tmp/tflint /usr/local/bin/tflint
          tflint --init
          pip install -q checkov

      - name: Install Prowler verification dependencies
        run: |
          pip install prowler pandas

      - name: Pre-flight AWS discovery
        run: bash iac/scripts/preflight_discovery.sh /tmp/aws_discovery.json

      - name: Ensure Service-Linked Roles
        run: bash iac/scripts/ensure_slr.sh /tmp/aws_discovery.json

      - name: Collect changed files and group by category
        id: changed
        run: |
          # Strategy: extract category from PR branch name + manifest files.
          # git diff on .tf files alone misses cases where .tf files were already
          # merged to main from a prior PR (only manifest JSON differs).
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if ! git cat-file -e "$HEAD" 2>/dev/null; then
            echo "WARN: head SHA $HEAD not found; using merge commit diff"
            HEAD="HEAD"
            BASE="HEAD~1"
          fi

          # Detect categories from all changed remediation files (.tf + .json)
          files=$(git diff --name-status "$BASE" "$HEAD" -- 'remediation/**' | awk '$1!="D"{print $NF}' | tr '\n' ' ')
          echo "files=$files" >> $GITHUB_OUTPUT

          categories=""
          for file in $files; do
            # remediation/iam/fix-xxx.tf -> iam
            # remediation/manifests/iam.json -> iam
            dir=$(echo "$file" | cut -d'/' -f2)
            if [ "$dir" = "manifests" ]; then
              # Extract category from manifest filename: manifests/iam.json -> iam
              cat=$(basename "$file" .json)
            else
              cat="$dir"
            fi
            if [ -n "$cat" ] && ! echo "$categories" | grep -qw "$cat"; then
              categories="$categories $cat"
            fi
          done

          # Fallback: extract category from PR branch name (remediation/<cat>-<id>-<batch>)
          branch="${{ github.event.pull_request.head.ref }}"
          if [ -z "$(echo $categories | xargs)" ] && echo "$branch" | grep -q '^remediation/'; then
            cat=$(echo "$branch" | sed 's|^remediation/||' | sed 's/-[0-9].*$//')
            if [ -n "$cat" ]; then
              echo "INFO: No files detected via diff; using branch name category: $cat"
              categories="$cat"
            fi
          fi

          echo "categories=$(echo $categories | xargs)" >> $GITHUB_OUTPUT
          echo "Detected categories: $(echo $categories | xargs)"

      - name: Collect target check IDs from manifest
        id: target_checks
        env:
          CATEGORIES: ${{ steps.changed.outputs.categories }}
        run: |
          python3 - <<'PY'
          import json
          import os

          categories = {c.strip() for c in os.environ.get("CATEGORIES", "").split() if c.strip()}
          check_ids = set()

          def load_items_for_category(category: str):
              cat_manifest = f"remediation/manifests/{category}.json"
              if os.path.exists(cat_manifest):
                  with open(cat_manifest, "r", encoding="utf-8") as f:
                      return json.load(f)
              root_manifest = "remediation/manifest.json"
              if os.path.exists(root_manifest):
                  with open(root_manifest, "r", encoding="utf-8") as f:
                      items = json.load(f)
                  return [i for i in items if str(i.get("category", "")).strip() == category]
              return []

          for category in sorted(categories):
              for item in load_items_for_category(category):
                  if str(item.get("validation_status", "ok")).strip().lower() == "excluded":
                      continue
                  cid = str(item.get("check_id", "")).strip()
                  if cid:
                      check_ids.add(cid)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"check_ids={','.join(sorted(check_ids))}\n")

          print(f"Target categories: {sorted(categories)}")
          print(f"Target check_ids ({len(check_ids)}): {sorted(check_ids)}")
          PY

      - name: Terraform Apply (per category)
        env:
          MAX_APPLY_RETRIES: "3"
          IMPORT_SCRIPT: "iac/scripts/auto_import.sh"
        run: |
          set -euo pipefail
          : > /tmp/tfapply.txt
          : > /tmp/target_resource_hints.txt
          applied=0
          skipped=0
          failed=0

          if [ -z "${{ steps.changed.outputs.categories }}" ]; then
            echo "No remediation categories changed."
            exit 0
          fi

          for category in ${{ steps.changed.outputs.categories }}; do
            echo "## Category: $category" >> /tmp/tfapply.txt
            work=$(mktemp -d)
            state_key="remediation/${category}.tfstate"

            # Copy only files listed in category-specific manifest for this category.
            # Fallback to remediation/manifest.json for backward compatibility.
            file_count=0
            cat_files=$(CATEGORY="$category" python3 - <<'PY'
          import json
          import os

          category = os.environ.get("CATEGORY", "").strip()
          selected = []
          if category:
              cat_manifest = f"remediation/manifests/{category}.json"
              root_manifest = "remediation/manifest.json"
              items = []
              if os.path.exists(cat_manifest):
                  with open(cat_manifest, "r", encoding="utf-8") as f:
                      items = json.load(f)
              elif os.path.exists(root_manifest):
                  with open(root_manifest, "r", encoding="utf-8") as f:
                      items = json.load(f)
              seen = set()
              for item in items:
                  if str(item.get("category", "")).strip() != category:
                      continue
                  if str(item.get("validation_status", "ok")).strip().lower() == "excluded":
                      continue
                  fname = str(item.get("file") or item.get("output_path") or "").strip()
                  if not fname or fname in seen:
                      continue
                  seen.add(fname)
                  selected.append(f"remediation/{fname}")
          print("\n".join(selected))
          PY
            )
            for f in $cat_files; do
              [ -f "$f" ] || continue
              cp "$f" "$work/"
              file_count=$((file_count+1))
            done

            if [ "$file_count" -eq 0 ]; then
              echo "SKIP $category: no files found" | tee -a /tmp/tfapply.txt
              skipped=$((skipped+1))
              continue
            fi

            echo "  Files: $file_count" >> /tmp/tfapply.txt

            # Run cleanup on each file
            for tf in "$work"/*.tf; do
              python3 iac/scripts/cleanup_hcl.py "$tf"
            done

            # Deduplicate resource/data blocks across files
            python3 iac/scripts/dedup_resources.py "$work"

            # Inject lifecycle protection
            python3 iac/scripts/inject_lifecycle.py "$work"

            # Copy optional tfvars for this category (if provided)
            if [ -f "remediation/${category}.auto.tfvars" ]; then
              cp "remediation/${category}.auto.tfvars" "$work/"
            fi
            if [ -f "remediation/terraform.auto.tfvars" ]; then
              cp "remediation/terraform.auto.tfvars" "$work/"
            fi

            # Generate discovery-driven tfvars so variables get real values
            # instead of default="" which causes count=0 (no resources created)
            manifest_path="remediation/manifests/${category}.json"
            if [ ! -f "$manifest_path" ]; then
              manifest_path="remediation/manifest.json"
            fi
            python3 iac/scripts/generate_tfvars.py /tmp/aws_discovery.json "$work" "$category" "$manifest_path" 2>&1 || true

            # Collect resource hints for scoped post-apply verification.
            # This prevents counting unrelated account-wide FAILs from same check_id.
            for tfvars in "$work"/*.auto.tfvars; do
              [ -f "$tfvars" ] || continue
              awk -F= '
                /^[[:space:]]*(s3_bucket_name|s3_target_bucket_name|s3_logging_bucket_name|log_bucket_name|cloudtrail_name|config_bucket_name)[[:space:]]*=/ {
                  v=$2
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", v)
                  gsub(/^"|"$/, "", v)
                  if (length(v) > 0) print v
                }
              ' "$tfvars" >> /tmp/target_resource_hints.txt || true
            done

            # Check if any resource blocks remain
            if ! grep -rEq '^\s*resource\s+"' "$work"/*.tf 2>/dev/null; then
              echo "SKIP $category: no resource blocks after cleanup" | tee -a /tmp/tfapply.txt
              skipped=$((skipped+1))
              continue
            fi

            cat > "$work/backend.tf" <<EOF
          terraform {
            backend "s3" {
              bucket         = "${TF_BACKEND_BUCKET}"
              key            = "${state_key}"
              region         = "${TF_BACKEND_REGION}"
              dynamodb_table = "${TF_BACKEND_TABLE}"
              encrypt        = true
            }
          }
          EOF

            cat > "$work/provider.tf" <<'EOF'
          provider "aws" {
            region = "ap-northeast-2"
          }
          EOF

            cat > "$work/data.tf" <<'EOF'
          data "aws_caller_identity" "current" {}
          data "aws_region" "current" {}
          data "aws_partition" "current" {}
          EOF

            cat > "$work/.tflint.hcl" <<'EOF'
          rule "terraform_unused_declarations" {
            enabled = false
          }
          rule "terraform_required_providers" {
            enabled = false
          }
          rule "terraform_required_version" {
            enabled = false
          }
          rule "terraform_deprecated_interpolation" {
            enabled = false
          }
          EOF

            # tflint (non-blocking for apply — errors already caught in plan)
            (cd "$work" && tflint -f compact --minimum-failure-severity=error 2>&1 | tee -a /tmp/tfapply.txt) || {
              echo "WARN $category: tflint issues (non-blocking for apply)" | tee -a /tmp/tfapply.txt
            }

            # tfsec: record warnings only
            tfsec --no-colour "$work" 2>&1 | tee -a /tmp/tfapply.txt || echo "WARN $category: tfsec found issues (non-blocking)" | tee -a /tmp/tfapply.txt

            # Checkov: built-in + custom checks (non-blocking for apply)
            checkov -d "$work" \
              --external-checks-dir iac/policies/checkov \
              --config-file iac/policies/.checkov.yaml \
              --output cli \
              --soft-fail \
              2>&1 | tee -a /tmp/tfapply.txt || true

            # validate
            if ! terraform -chdir="$work" init -input=false 2>&1 | tee -a /tmp/tfapply.txt; then
              echo "SKIP $category: init failed" | tee -a /tmp/tfapply.txt
              failed=$((failed+1))
              continue
            fi
            if ! terraform -chdir="$work" validate 2>&1 | tee -a /tmp/tfapply.txt; then
              echo "SKIP $category: validate failed" | tee -a /tmp/tfapply.txt
              failed=$((failed+1))
              continue
            fi

            # Resilient apply with retry, import, state-lock recovery
            echo "[$category] Starting resilient apply..." | tee -a /tmp/tfapply.txt
            if bash iac/scripts/resilient_apply.sh "$work" "$category" /tmp/aws_discovery.json /tmp/tfapply.txt; then
              applied=$((applied+1))
            else
              echo "FAIL $category: resilient apply exhausted retries" | tee -a /tmp/tfapply.txt
              failed=$((failed+1))
            fi
          done

          echo "applied=$applied skipped=$skipped failed=$failed" >> /tmp/tfapply.txt
          sort -u /tmp/target_resource_hints.txt -o /tmp/target_resource_hints.txt || true
          echo "target_resource_hints=$(wc -l < /tmp/target_resource_hints.txt || echo 0)" >> /tmp/tfapply.txt
          echo "Summary: applied=$applied skipped=$skipped failed=$failed"
          if [ "$applied" -eq 0 ] && [ "$failed" -gt 0 ]; then
            echo "No categories applied and failures present. Failing job." | tee -a /tmp/tfapply.txt
            exit 1
          fi
          # Partial success is acceptable — some categories may fail due to AWS limitations
          if [ "$failed" -gt 0 ]; then
            echo "WARNING: $failed category(s) failed, but $applied succeeded." | tee -a /tmp/tfapply.txt
          fi

      - name: Post-apply Prowler scan for target checks
        if: steps.target_checks.outputs.check_ids != ''
        env:
          CHECK_IDS: ${{ steps.target_checks.outputs.check_ids }}
        run: |
          set -euo pipefail
          # IAM/global resources can have short propagation delay after apply.
          # Wait before post-apply scan to reduce transient FAIL noise.
          SLEEP_SECONDS="${POST_APPLY_SCAN_DELAY_SECONDS:-150}"
          echo "Waiting ${SLEEP_SECONDS}s before post-apply verification scan..."
          sleep "$SLEEP_SECONDS"

          mkdir -p /tmp/post_scan

          set +e
          prowler aws \
            --region ap-northeast-2 \
            --compliance cis_1.4_aws \
            --severity medium \
            --output-directory /tmp/post_scan \
            --output-formats csv
          prowler_exit=$?
          set -e

          # Prowler can return 3 when findings exist; that should not stop apply flow.
          if [ "$prowler_exit" -ne 0 ] && [ "$prowler_exit" -ne 3 ]; then
            echo "Unexpected prowler exit code: $prowler_exit"
            exit "$prowler_exit"
          fi

          python3 - <<'PY'
          import glob
          import json
          import os
          import pandas as pd

          check_ids = {x.strip() for x in os.environ.get("CHECK_IDS", "").split(",") if x.strip()}
          frames = []
          resource_cols = ["RESOURCE_UID", "RESOURCE_ID", "RESOURCE_ARN", "RESOURCE_NAME", "RESOURCE"]
          found_resource_col = None
          for path in glob.glob("/tmp/post_scan/*.csv"):
              try:
                  df = pd.read_csv(path, sep=";")
              except Exception:
                  continue
              if {"CHECK_ID", "STATUS"}.issubset(df.columns):
                  cols = ["CHECK_ID", "STATUS"] + [c for c in resource_cols if c in df.columns]
                  for c in resource_cols:
                      if c in df.columns and not found_resource_col:
                          found_resource_col = c
                  frames.append(df[cols])

          data = pd.concat(frames, ignore_index=True) if frames else pd.DataFrame(columns=["CHECK_ID", "STATUS"])
          if check_ids:
              data = data[data["CHECK_ID"].astype(str).isin(check_ids)]

          hints = []
          hints_path = "/tmp/target_resource_hints.txt"
          if os.path.exists(hints_path):
              with open(hints_path, "r", encoding="utf-8") as f:
                  hints = [line.strip() for line in f if line.strip()]
          hints = sorted(set(hints))

          if hints:
              present_cols = [c for c in resource_cols if c in data.columns]
              if present_cols:
                  def row_matches_hint(row):
                      joined = " ".join(str(row.get(c, "")) for c in present_cols).lower()
                      return any(h.lower() in joined for h in hints)
                  data = data[data.apply(row_matches_hint, axis=1)]

          fails = data[data["STATUS"].astype(str).str.upper() == "FAIL"]
          fail_count = int(len(fails))
          fail_by_check = fails.groupby("CHECK_ID").size().sort_values(ascending=False).to_dict()

          with open("/tmp/post_fail_count.txt", "w", encoding="utf-8") as f:
              f.write(str(fail_count))
          with open("/tmp/post_fail_by_check.json", "w", encoding="utf-8") as f:
              json.dump(fail_by_check, f, indent=2)
          with open("/tmp/post_scope_summary.json", "w", encoding="utf-8") as f:
              json.dump(
                  {
                      "target_check_ids": sorted(check_ids),
                      "resource_hints": hints,
                      "resource_column_detected": found_resource_col,
                      "rows_scanned_after_filter": int(len(data)),
                      "fails_after_filter": fail_count,
                  },
                  f,
                  indent=2,
              )

          print(f"Post-apply FAIL count (scoped target checks/resources): {fail_count}")
          PY

      - name: Evaluate Post-apply Verification
        if: always()
        run: |
          set -euo pipefail
          strict="${STRICT_POST_APPLY_VERIFICATION:-false}"
          fail_count="$(cat /tmp/post_fail_count.txt 2>/dev/null || echo 0)"
          echo "Scoped post-apply fail count: ${fail_count}"
          if [ "$strict" = "true" ] && [ "${fail_count}" -gt 0 ]; then
            echo "Post-apply verification failed: scoped FAIL remains (${fail_count})."
            exit 1
          fi
          echo "Post-apply verification passed."

      - name: Trigger Prowler Re-scan
        run: |
          gh workflow run prowler-security-scan.yml -f mode=all-checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload apply logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: remediation-apply-logs
          path: |
            /tmp/tfapply.txt
            /tmp/aws_discovery.json
            /tmp/post_fail_count.txt
            /tmp/post_fail_by_check.json
            /tmp/post_scope_summary.json
            /tmp/target_resource_hints.txt
